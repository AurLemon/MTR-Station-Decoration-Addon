pluginManagement {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.neoforged.net/releases/" }
		maven { url = "https://maven.minecraftforge.net/" }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version "+"
}

def selectedMinecraftVersion = gradle.startParameter.projectProperties.get("minecraft_version") ?: gradle.startParameter.projectProperties.get("minecraftVersion") ?: "1.20.4"

if (selectedMinecraftVersion == "1.21.1") {
	include("neoforge")
} else {
	include("fabric")
	include("forge")
}

rootProject.name = "MTR-Station-Decoration-Addon"
