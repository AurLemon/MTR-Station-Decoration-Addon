name: Build

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "image/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "image/**"
      - ".gitignore"
      - "LICENSE"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v1
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
      - uses: gradle/gradle-build-action@v2
      - run: chmod +x ./gradlew
      - uses: actions/cache@v3
        with:
          path: checkouts/
          key: mtr-deps-${{ hashFiles('gradle.properties') }}
          restore-keys: mtr-deps-
      - run: ./gradlew setupLibrary --project-prop buildVersion=1.20.1 --no-daemon
      - run: ./gradlew build --project-prop buildVersion=1.20.1 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MTR-MSD-Addon-artifacts
          path: build/release/*.jar
