name: Build
on: [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build NeoForge 1.21.1
        run: ./gradlew :neoforge:build -Pminecraft_version=1.21.1 --no-daemon
      - name: Upload NeoForge 1.21.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTR-Station-Decoration-Addon-neoforge-1.21.1
          if-no-files-found: error
          path: |
            build/*neoforge*.jar
            neoforge/build/libs/neoforge-*.jar
